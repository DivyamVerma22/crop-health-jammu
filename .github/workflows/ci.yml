name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          # Install a slim subset: full GEE/TF stack is heavy and not
          # required for an import-only smoke test.
          pip install numpy pandas scikit-learn joblib streamlit folium streamlit-folium

      - name: Verify Streamlit app imports
        run: |
          python -c "
          import ast, pathlib
          src = pathlib.Path('app/app.py').read_text()
          ast.parse(src)
          print('app/app.py parses OK')
          "

      - name: Verify notebooks are valid JSON
        run: |
          python -c "
          import json, pathlib
          for nb in pathlib.Path('notebooks').glob('*.ipynb'):
              json.loads(nb.read_text())
              print(f'OK: {nb.name}')
          "
